  <meta property="og:site_name" content="Craps Lab">
  <meta property="og:title" content="Craps Lab — test craps strategies with paper money">
  <meta property="og:description" content="Play a casino-accurate craps table with paper money, or simulate thousands of sessions to see which betting strategies hold up best.">
  <meta property="og:url" content="https://wombus.github.io/craps-prob/">
  <meta property="og:image" content="https://wombus.github.io/craps-prob/assets/og-image.png">

</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-dice" aria-hidden="true">⚂</span>
      <div>
        <h1>Craps Lab</h1>
        <p class="tagline">Monte Carlo strategy simulator · casino-accurate rules · paper money</p>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-tab="simulator" aria-controls="panel-simulator">Simulator</button>
      <button class="tab" role="tab" data-tab="explorer" aria-controls="panel-explorer">Strategy Explorer</button>
      <button class="tab" role="tab" data-tab="live" aria-controls="panel-live">Live Table</button>
      <button class="tab" role="tab" data-tab="learn" aria-controls="panel-learn">Odds &amp; Learn</button>
      <button class="tab" role="tab" data-tab="rules" aria-controls="panel-rules">Table Rules</button>
    </nav>
    <button id="rules-chip" class="rules-chip" title="Current table rules — click to change"></button>
  </header>

  <main>
    <section id="panel-simulator" class="panel" role="tabpanel" hidden></section>
    <section id="panel-explorer" class="panel" role="tabpanel" hidden></section>
    <section id="panel-live" class="panel" role="tabpanel" hidden></section>
    <section id="panel-learn" class="panel" role="tabpanel" hidden></section>
    <section id="panel-rules" class="panel" role="tabpanel" hidden></section>
  </main>

  <footer class="app-footer">
    <p>For education and entertainment. Every craps bet except free odds carries a house edge — no strategy changes that. Play responsibly.</p>
  </footer>

  <noscript><p class="noscript">Craps Lab needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
